spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: menu-service
              uri: lb://menu-service
              predicates:
                - Path=/api/v1/menu-items/**
            - id: food-order-service
              uri: lb://food-order-service
              predicates:
                - Path=/api/v1/food-orders/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
